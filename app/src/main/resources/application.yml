spring:
  application:
    name: enterprise-knowledge-assistant

  datasource:
    url: ${EKA_DB_URL:jdbc:postgresql://localhost:5432/eka}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  sql:
    init:
      mode: never
  flyway:
    clean-disabled: true
    locations: classpath:db/migration

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

eka:
  upload:
    enabled: ${EKA_UPLOAD_ENABLED:false}
    scan:
      enabled: ${EKA_UPLOAD_SCAN_ENABLED:false}
      clamav-host: ${EKA_CLAMAV_HOST:localhost}
      clamav-port: ${EKA_CLAMAV_PORT:3310}
      clamav-timeout-ms: 30000
      inspection-timeout-seconds: 60
    endpoint: ${EKA_UPLOAD_ENDPOINT:http://localhost:9000}
    public-endpoint: ${EKA_UPLOAD_PUBLIC_ENDPOINT:http://localhost:9000}
    region: ${EKA_UPLOAD_REGION:us-east-1}
    bucket: ${EKA_UPLOAD_BUCKET:eka-documents}
    access-key: ${EKA_UPLOAD_ACCESS_KEY:}
    secret-key: ${EKA_UPLOAD_SECRET_KEY:}
  auth:
    registration:
      enabled: ${EKA_AUTH_REGISTRATION_ENABLED:false}
    private-key: ${EKA_AUTH_PRIVATE_KEY}
    public-key: ${EKA_AUTH_PUBLIC_KEY}
    issuer: ${EKA_AUTH_ISSUER}
    audience: ${EKA_AUTH_AUDIENCE}
