spring:
  application:
    name: enterprise-knowledge-assistant

  datasource:
    url: ${EKA_DB_URL:jdbc:postgresql://localhost:5432/eka}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  sql:
    init:
      mode: never
  flyway:
    clean-disabled: true
    locations: classpath:db/migration

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

eka:
  auth:
    private-key: ${EKA_AUTH_PRIVATE_KEY}
    public-key: ${EKA_AUTH_PUBLIC_KEY}
    issuer: ${EKA_AUTH_ISSUER}
    audience: ${EKA_AUTH_AUDIENCE}
