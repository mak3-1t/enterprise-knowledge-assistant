spring:
  application:
    name: enterprise-knowledge-assistant

  datasource:
    url: ${EKA_DB_URL:jdbc:postgresql://localhost:5432/eka}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  sql:
    init:
      mode: never
  flyway:
    clean-disabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
