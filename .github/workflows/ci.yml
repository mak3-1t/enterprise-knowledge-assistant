name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required files exist
        run: |
          for f in README.md LICENSE .gitignore .gitattributes .editorconfig .env.example CONTRIBUTING.md SECURITY.md; do
            test -f "$f" || { echo "Missing required file: $f"; exit 1; }
          done
          echo "All required files present."

      - name: Ensure no .env file is committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "A .env file is tracked by git. Remove it and rotate any secrets."
            exit 1
          fi
          echo "No .env file tracked."

      - name: Ensure no build output is committed
        run: |
          if git ls-files | grep -E '(^|/)target/'; then
            echo "Maven target/ directory is tracked by git."
            exit 1
          fi
          echo "No target/ directory tracked."

  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verify Docker for PostgreSQL integration tests
        run: docker info

      - name: Build and test
        run: ./mvnw -B verify

      - name: Verify Sprint 1 acceptance demo
        shell: pwsh
        run: ./scripts/sprint-01-demo.ps1 -IncludeRegistration -IncludeSessions

      - name: Verify framework spike (no local model required)
        run: ./mvnw -B -f spikes/ai-framework/pom.xml verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: "**/target/site/jacoco/**"
          if-no-files-found: warn
